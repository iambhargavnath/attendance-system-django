{% extends "base.html" %}
{% load crispy_forms_tags %}
{% block title %}{{ title }} - NIELIT{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-7">
    <nav aria-label="breadcrumb">
      <ol class="breadcrumb">
        <li class="breadcrumb-item"><a href="{% url 'management' %}">Management</a></li>
        <li class="breadcrumb-item active">{{ title }}</li>
      </ol>
    </nav>
    <div class="card">
      <div class="card-header"><h1 class="h5 mb-0">{{ title }}</h1></div>
      <div class="card-body">
        <p class="text-body-secondary">{{ subtitle }}</p>
        <form method="post" novalidate>
          {% csrf_token %}
          {{ form|crispy }}
          <div class="d-flex gap-2 mt-3">
            <button type="submit" class="btn btn-primary">Save</button>
            <a href="{{ back_url }}" class="btn btn-outline-secondary">{{ back_label }}</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
